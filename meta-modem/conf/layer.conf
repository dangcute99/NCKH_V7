BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "modem"
BBFILE_PATTERN_modem = "^${LAYERDIR}/"
BBFILE_PRIORITY_modem = "7"

LAYERDEPENDS_modem = "core"
# PetaLinux 2021.1 dựa trên Yocto gatesgarth
LAYERSERIES_COMPAT_modem = "gatesgarth"
