# Truy cập IP trên PL từ user space
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
CONFIG_UIO_DMEM_GENIRQ=y

# AXI DMA: mẫu tín hiệu giữa PL và DDR
CONFIG_XILINX_DMA=y

# Nạp lại bitstream và DT overlay khi đang chạy
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ZYNQ_FPGA=y
CONFIG_OF_OVERLAY=y
CONFIG_OF_CONFIGFS=y

# Ngoại vi cho front-end RF và QSPI
CONFIG_SPI_SPIDEV=y
CONFIG_I2C_CHARDEV=y
CONFIG_MTD_SPI_NOR=y

# Giám sát nhiệt độ/điện áp; nền cho driver RF dùng IIO
CONFIG_IIO=y
CONFIG_XILINX_XADC=y

# Giảm độ trễ cho vòng điều khiển modem
CONFIG_PREEMPT=y
# CONFIG_PREEMPT_NONE is not set
# CONFIG_PREEMPT_VOLUNTARY is not set
CONFIG_HIGH_RES_TIMERS=y
